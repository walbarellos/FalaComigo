<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificador SHA-256 - FalaComigo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f0f4ff;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #6366f1;
      --border: #dbe5f7;
      --ok: #0f766e;
      --bad: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(680px, calc(100vw - 32px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      padding: 24px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #f8faff;
      color: var(--text);
    }
    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      background: var(--brand);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }
    output {
      display: block;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: #f8faff;
      border: 1px solid var(--border);
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .ok { color: var(--ok); font-weight: 800; }
    .bad { color: var(--bad); font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <h1>FalaComigo</h1>
    <p>Verificador local de integridade. Use somente com o SHA-256 gerado do APK real desta release.</p>

    <label for="expectedHash">SHA-256 esperado</label>
    <input id="expectedHash" type="text" spellcheck="false" autocomplete="off" placeholder="Cole o hash oficial aqui">

    <label for="apkFile">APK</label>
    <input id="apkFile" type="file" accept=".apk,application/vnd.android.package-archive">

    <button id="verifyButton" type="button">Verificar APK</button>
    <output id="result">Aguardando arquivo e hash esperado.</output>
  </main>

  <script>
    const expectedHash = document.getElementById("expectedHash");
    const apkFile = document.getElementById("apkFile");
    const result = document.getElementById("result");
    const verifyButton = document.getElementById("verifyButton");

    async function sha256(file) {
      const buffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map((byte) => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    verifyButton.addEventListener("click", async () => {
      const file = apkFile.files[0];
      const expected = expectedHash.value.trim().toLowerCase();

      if (!expected || !/^[a-f0-9]{64}$/.test(expected)) {
        result.innerHTML = '<span class="bad">Informe um SHA-256 esperado válido.</span>';
        return;
      }
      if (!file) {
        result.innerHTML = '<span class="bad">Selecione um APK.</span>';
        return;
      }

      result.textContent = "Calculando...";
      const actual = await sha256(file);
      if (actual === expected) {
        result.innerHTML = '<span class="ok">PASS</span><br>SHA-256: ' + actual;
      } else {
        result.innerHTML = '<span class="bad">FAIL</span><br>SHA-256 calculado: ' + actual;
      }
    });
  </script>
</body>
</html>
